<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">

<title>Turni Auto</title>
<style>
:root{--bg:#f4f7ff;--card:#fff;--tx:#17243c;--mut:#71809b;--ac:#00ffba;--ac2:#0072ff;--line:#e4ebf7;--sh:0 8px 24px rgba(0,114,255,.13);--tod:#effff9;--danger:#ef4444;--guest:#64748b}
@media(prefers-color-scheme:dark){:root{--bg:#101827;--card:#192337;--tx:#edf5ff;--mut:#9badc7;--line:#29364d;--sh:0 8px 24px rgba(0,0,0,.34);--tod:#163a39}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.35 -apple-system,"SF Pro Rounded",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100dvh;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 clamp(10px,3vw,20px)}
.hero{background:linear-gradient(90deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 0 26px;border-radius:0 0 28px 28px;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.5px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;backdrop-filter:blur(8px)}
.today{margin-top:14px;background:rgba(255,255,255,.2);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.today small{display:block;opacity:.88;font-size:12px;text-transform:uppercase;letter-spacing:.6px}.today b{font-size:20px}
.app-logo{width:64px;height:64px;border-radius:18px;display:block;flex:none;object-fit:cover;background:rgba(255,255,255,.18);box-shadow:0 5px 16px rgba(0,0,0,.22)}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,40px);height:var(--s,40px);border-radius:50%;color:#fff;font-weight:800;font-size:calc(var(--s,40px)*.45);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.av.g{border:2px dashed rgba(255,255,255,.9)}
.mh{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:18px 6px 8px}
.wk{background:var(--card);border-radius:20px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;border:2px solid transparent}
.wk.cur{border-color:var(--ac2)}
.wh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:14px 16px;text-align:left;cursor:pointer}
.wt{flex:1;min-width:0}.wt b{display:block}.wt small{color:var(--mut)}
.mini{display:flex}.mini .av{--s:24px;margin-left:-6px;border:2px solid var(--card);box-shadow:none}.mini .av:first-child{margin-left:0}
.wk.open>.wh .mini{display:none}
.chev{width:22px;height:22px;flex:none;color:var(--ac2);transition:transform .3s}.wk.open>.wh .chev{transform:rotate(180deg)}
.wb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.wk.open>.wb{grid-template-rows:1fr}.wi{overflow:hidden}
.pg{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.pgi{padding:0 8px 8px}.pgi .wk{box-shadow:none;border:1px solid var(--line)}
.dr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.dr:active{background:var(--line)}.dr.t{background:var(--tod)}
.dr.pa .dd,.dr.pa .dn>b,.dr.pa .av{opacity:.65}
.dd{width:42px;text-align:center;flex:none}.dd small{display:block;color:var(--mut);text-transform:uppercase;font-size:11px;font-weight:800}.dd b{font-size:20px}
.dn{flex:1;min-width:0}.dn b{font-size:17px}
.bd{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;color:#fff}
.bd.o{background:var(--guest)}.bd.e{background:var(--danger)}.bd.t{background:var(--ac2)}
.nt{color:var(--mut);font-size:13px;margin-top:3px;overflow-wrap:anywhere;border-left:3px solid var(--ac2);padding-left:8px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px}
.ttl{font-size:clamp(24px,5vw,30px);font-weight:800;margin:calc(env(safe-area-inset-top) + 18px) 4px 14px;letter-spacing:-.4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);width:100%;max-width:100%;min-width:0;padding:13px 14px;margin:6px 0;border:2px solid var(--line);border-radius:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac2)}
input[type="date"]{display:block;min-width:0;width:100%;max-width:100%;height:52px;appearance:none;-webkit-appearance:none;font-size:16px;padding:10px 12px}
.b{display:block;width:100%;font:inherit;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--ac) 0%,var(--ac2) 100%);border:0;border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}
.b.s{background:var(--line);color:var(--tx)}.b.x{background:var(--danger)}.b:active{transform:scale(.98)}
.sm{font-size:13px;color:var(--mut)}
.nm{display:flex;align-items:center;gap:10px;margin:8px 0;min-width:0}.nm input[type=text],.nm input:not([type]){flex:1;min-width:0;margin:0}.nm b{flex:1;min-width:0}
.sw{width:44px;height:44px;border-radius:14px;overflow:hidden;position:relative;flex:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--line)}
.sw input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;margin:0;padding:0;border:0}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.step b{font-size:17px}
.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:800;font-size:20px;padding:12px 0;border-radius:12px}
.seg button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 12px rgba(0,114,255,.35)}
.ord{display:flex;align-items:center;flex-wrap:wrap;gap:6px 4px;margin-top:6px}.ord .it{display:flex;align-items:center;gap:6px}.ord .it small{font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ord .ar{color:var(--mut);font-size:18px;margin:0 2px}
.logo{display:flex;align-items:center;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.tile small{color:var(--mut);font-size:12px;font-weight:700}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.sbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.donut>div{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}.donut b{font-size:26px;font-weight:800;line-height:1}.donut small{color:var(--mut);font-size:12px}.rk{flex:1;min-width:230px}
.srow{margin:12px 0}.srow .l{display:flex;align-items:center;gap:10px}.srow .l b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .l span{font-weight:800;font-size:18px}.srow .l em{font-style:normal;color:var(--mut);font-size:13px;width:42px;text-align:right}.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}.nx{font-size:12px;color:var(--mut);margin-top:4px}.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(92%,460px);display:flex;background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(0,114,255,.28);padding:6px;border:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:18px;padding:8px 4px;font:inherit;font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}nav svg{width:22px;height:22px}nav button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
dialog{border:0;border-radius:26px 26px 0 0;padding:20px;width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--tx);max-height:92dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}dialog::backdrop{background:rgba(10,20,40,.55);backdrop-filter:blur(3px)}
@media(min-width:600px){dialog{margin:auto;border-radius:26px}.dr{padding:14px 20px}.wh{padding:16px 20px}}
@media(max-width:360px){.dd{width:36px}.dn b{font-size:15px}.bd{margin-left:4px}.donut{width:130px;height:130px}.donut>div{width:82px;height:82px}}
</style></head><body>
<div id="app"></div>
<input type="file" id="imf" accept=".json,application/json" style="display:none" onchange="imp(this)">
<nav id="nav" style="display:none"></nav>
<dialog id="dlg"></dialog>

<script>
const BASE=new URL('.',location.href).pathname;

const KEY='turniAuto3',KEEP=60,APP_VERSION='v18';
const PAL=['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6'],GC='#64748b';
const $=id=>document.getElementById(id);

let S=null;
try{
 S=JSON.parse(localStorage.getItem(KEY)||'null');
}catch(e){
 console.error('Errore lettura dati salvati:',e);
 S=null;
}

let tab='c',openW=new Set(),initOpen=0,showPast=false,setupN=4,SV={n:[],c:[]};

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>new Date(s+'T12:00:00');
const todayS=()=>iso(new Date());
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>((n||'').trim().charAt(0).toUpperCase())||'?';

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const IC={c:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',s:'<path d="M5 20V10M12 20V4M19 20v-7"/>',i:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};

function appLogo(){
 return `<img class="app-logo" src="${BASE}icon-512.png" alt="Turni Auto" onerror="this.remove()">`;
}

function ensure(){
 if(!S)return;
 S.names=S.names||[];
 S.colors=S.colors||{};
 S.notes=S.notes||{};
 S.extra=S.extra||[];
 S.absences=S.absences||[];
 S.overrides=S.overrides||{};
 S.removed=S.removed||[];
 S.since=S.since||S.start||todayS();
 S.start=S.start||todayS();
 S.names.forEach((n,i)=>{if(!S.colors[n])S.colors[n]=PAL[i%PAL.length]});
}

const col=(n,g)=>(!g&&S&&S.colors&&S.colors[n])||GC;
const av=(n,g,s)=>`<span class="av ${g?'g':''}" style="--s:${s||40}px;background:${col(n,g)}">${esc(ini(n))}</span>`;

function easter(y){
 const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;
 return new Date(y,Math.floor(t/31)-1,(t%31)+1,12);
}

function isHoliday(d){
 const w=d.getDay();
 if(w===0||w===6)return true;
 if(['1-1','6-1','25-4','1-5','2-6','15-8','1-11','8-12','25-12','26-12'].includes(d.getDate()+'-'+(d.getMonth()+1)))return true;
 const p=easter(d.getFullYear());p.setDate(p.getDate()+1);
 return iso(p)===iso(d);
}

function mon(s){
 const d=dt(s);
 d.setDate(d.getDate()-((d.getDay()+6)%7));
 return iso(d);
}

function weekDates(k){
 const d=dt(k),out=[];
 for(let z=0;z<7;z++){out.push(iso(d));d.setDate(d.getDate()+1)}
 return out;
}

function activeAbsences(date){
 const wk=mon(date);
 return S.absences.filter(a=>a.week===wk).map(a=>a.name);
}

function futureLimitDate(){
 const d=new Date();
 d.setMonth(d.getMonth()+6);
 d.setDate(d.getDate()+(7-((d.getDay()+6)%7)));
 return iso(d);
}

function calendarDates(){
 const out=[],removed=new Set(S.removed||[]);
 const end=futureLimitDate();
 let d=dt(S.start),guard=0;

 while(iso(d)<=end&&guard<10000){
  const id=iso(d);
  const work=!isHoliday(d)||(S.extra||[]).includes(id);
  if(work&&!removed.has(id))out.push(id);
  d.setDate(d.getDate()+1);
  guard++;
 }
 return out;
}

function fullBuild(){
 if(!S||!S.names||!S.names.length)return [];
 ensure();
 const dates=calendarDates(),out=[];
 let pos=0;

 for(let i=0;i<dates.length;i++){
  const date=dates[i];
  const absent=new Set(activeAbsences(date));
  const forced=S.overrides[date];

  if(forced&&forced.g){
   out.push({...forced});
   continue;
  }

  let who,safe=0;
  do{
   who=S.names[pos%S.names.length];
   pos=(pos+1)%S.names.length;
   safe++;
  }while(absent.has(who)&&safe<S.names.length*3);

  if(forced){
   out.push({...forced});
  }else{
   out.push({n:who,g:0,type:'normal'});
  }
 }

 return out;
}

function prune(){
 if(!S)return;
 ensure();
 save();
}

function display(){
 const dates=calendarDates(),qAll=fullBuild();
 const today=todayS();
 const pastIdx=[],futureIdx=[];
 dates.forEach((d,i)=>{
  if(d<today)pastIdx.push(i);
  else futureIdx.push(i);
 });
 const keepPast=pastIdx.slice(-KEEP);
 const displayIdx=[...keepPast,...futureIdx];
 return {
  ds:displayIdx.map(i=>dates[i]),
  q:displayIdx.map(i=>qAll[i])
 };
}

function range(a,b){
 const x=dt(a),y=dt(b),mo=d=>d.toLocaleDateString('it-IT',{month:'short'});
 if(a===b)return x.getDate()+' '+mo(x);
 return x.getMonth()===y.getMonth()?`${x.getDate()} – ${y.getDate()} ${mo(y)}`:`${x.getDate()} ${mo(x)} – ${y.getDate()} ${mo(y)}`;
}

function wnum(k){
 const d=dt(k);d.setDate(d.getDate()+3);
 const j=new Date(d.getFullYear(),0,4,12);
 return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7);
}

function grab(){
 for(let i=0;i<5;i++){
  const p=$('p'+i),c=$('c'+i);
  if(p)SV.n[i]=p.value;
  if(c)SV.c[i]=c.value;
 }
}

function setN(n){
 grab();setupN=n;
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
 drawNames();
}

function drawNames(){
 let h='';
 for(let i=0;i<setupN;i++){
  const c=SV.c[i]||PAL[i];
  h+=`<div class="nm"><span class="av" id="a${i}" style="--s:44px;background:${c}">${esc(ini(SV.n[i]))}</span>
  <input id="p${i}" placeholder="Nome guidatore ${i+1}" value="${esc(SV.n[i]||'')}" oninput="upd(${i})" autocapitalize="words" autocomplete="off">
  <label class="sw" id="s${i}" style="background:${c}"><input type="color" id="c${i}" value="${c}" oninput="upd(${i})"></label></div>`;
 }
 $('nm').innerHTML=h;
 prev();
}

function upd(i){
 const c=$('c'+i).value;
 $('a'+i).style.background=c;
 $('a'+i).textContent=ini($('p'+i).value);
 $('s'+i).style.background=c;
 prev();
}

function prev(){
 let h='';
 for(let i=0;i<setupN;i++){
  const n=($('p'+i)||{}).value||'',c=($('c'+i)||{}).value||PAL[i];
  h+=`<div class="it"><span class="av" style="--s:30px;background:${c}">${esc(ini(n))}</span><small>${esc(n||('Nome '+(i+1)))}</small></div><span class="ar">›</span>`;
 }
 $('ord').innerHTML=h+'<span class="ar">↻</span>';
}

function create(){
 grab();
 const names=[],colors={};

 for(let i=0;i<setupN;i++){
  const n=($('p'+i).value||'').trim();
  names.push(n);
  colors[n]=$('c'+i).value;
 }

 if(names.some(x=>!x))return alert('Compila il nome di tutti i guidatori');
 if(new Set(names.map(x=>x.toLowerCase())).size<names.length)return alert('I nomi devono essere diversi');
 if(!$('sd').value)return alert('Scegli la data di partenza');

 S={names,colors,start:$('sd').value,since:$('sd').value,notes:{},extra:[],removed:[],absences:[],overrides:{},lb:null};
 prune();initOpen=0;window._sc=0;render();
}

async function exp(){
 S.lb=todayS();save();
 const json=JSON.stringify({app:'turni-auto',v:18,data:S});
 const fn='turni-backup-'+todayS()+'.json';

 try{
  const f=new File([json],fn,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});render();return}
 }catch(e){if(e.name==='AbortError')return}

 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
 a.download=fn;
 document.body.appendChild(a);a.click();a.remove();render();
}

function migrate(old){
 if(old.start)return old;
 return {
  names:old.names||[],
  colors:old.colors||{},
  start:old.base||todayS(),
  since:old.since||old.base||todayS(),
  notes:old.notes||{},
  extra:old.x||[],
  removed:[],
  absences:[],
  overrides:{},
  lb:old.lb||null
 };
}

function imp(input){
 const f=input.files[0];if(!f)return;
 const rd=new FileReader();

 rd.onload=()=>{
  try{
   const o=JSON.parse(rd.result);
   if(o.app!=='turni-auto'||!o.data)throw 0;
   if(S&&!confirm('Sostituire i dati attuali con quelli del backup?'))return;
   S=migrate(o.data);ensure();prune();tab='c';initOpen=0;window._sc=0;render();alert('Backup importato');
  }catch(e){alert('File di backup non valido')}
  input.value='';
 };

 rd.readAsText(f);
}

function noteSet(d,v){
 const n=(v||'').trim();
 if(n)S.notes[d]=n;
 else delete S.notes[d];
}

function edit(i){
 const {ds,q}=display(),d=ds[i],x=q[i],past=d<todayS(),extra=S.extra.includes(d);
 const hasOverride=!!S.overrides[d];
 const weekAbsences=S.absences.filter(a=>a.week===mon(d));

 $('dlg').innerHTML=`
 <div class="hrow" style="justify-content:flex-start;gap:12px">
  ${av(x.n,x.g,48)}
  <div><b style="font-size:18px">${dt(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</b>
  ${extra?'<div class="sm">Giorno extra</div>':''}${past?'<div class="sm">Giorno passato: puoi correggere dati e note</div>':''}</div>
 </div>
 <input id="en" list="nl" value="${esc(x.n)}" placeholder="Chi guida">
 <datalist id="nl">${S.names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <textarea id="et" rows="3" placeholder="Note del giorno">${esc(S.notes[d])}</textarea>
 <button class="b" onclick="saveDay(${i})">Salva modifiche (questo giorno)</button>
 ${hasOverride?`<button class="b s" onclick="resetDay('${d}')">Ripristina turno automatico (${x.type==='swap'?'annulla scambio':'annulla modifica'})</button>`:''}
 <button class="b s" onclick="swapUI(${i})">Scambia con un altro giorno</button>
 ${past?'':`
 <button class="b s" onclick="absenceUI(${i})">Imposta assenza questa settimana</button>
 ${weekAbsences.map(a=>`<button class="b s" data-id="${esc(a.id)}" onclick="undoAbsence(this.dataset.id)">Annulla assenza di ${esc(a.name)}</button>`).join('')}
 <button class="b s" onclick="guestUI(${i})">Inserisci ospite qui</button>
 ${x.g&&x.type==='guest'?`<button class="b x" onclick="removeGuest('${d}')">Rimuovi ospite</button>`:''}
 <button class="b x" onclick="removeDay('${d}')">Rimuovi questo giorno</button>`}
 ${extra?`<button class="b x" onclick="removeExtra('${d}')">Rimuovi giorno extra</button>`:''}
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;
 $('dlg').showModal();
}

function saveDay(i){
 const {ds,q}=display(),d=ds[i],n=$('en').value.trim();
 if(!n)return alert('Inserisci un nome');
 noteSet(d,$('et').value);
 if(n!==q[i].n||S.overrides[d]){
  S.overrides[d]={n,g:S.names.includes(n)?0:1,type:S.names.includes(n)?'manual':'guest'};
 }
 save();$('dlg').close();render();
}

function resetDay(d){
 delete S.overrides[d];save();$('dlg').close();render();
}

function swapUI(i){
 const {ds,q}=display(),lo=Math.max(0,i-15),hi=Math.min(q.length-1,i+40);
 let o='';
 for(let j=lo;j<=hi;j++){
  if(j===i)continue;
  o+=`<option value="${j}"${j===i+1?' selected':''}>${dt(ds[j]).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} · ${esc(q[j].n)}</option>`;
 }

 $('dlg').innerHTML=`<b style="font-size:18px">Scambia turno</b>
 <div class="sm" style="margin:6px 0 10px">I due guidatori selezionati vengono invertiti. Il resto del calendario non cambia.</div>
 <select id="swd">${o}</select>
 <button class="b" onclick="doSwap(${i})">Scambia</button>
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;
 $('dlg').showModal();
}

function doSwap(i){
 const j=+$('swd').value;if(Number.isNaN(j)||j===i)return;
 const {ds,q}=display(),a=q[i],b=q[j];
 S.overrides[ds[i]]={n:b.n,g:b.g?1:0,type:'swap'};
 S.overrides[ds[j]]={n:a.n,g:a.g?1:0,type:'swap'};
 save();$('dlg').close();render();
}

function guestUI(i){
 const {ds}=display(),d=ds[i];
 $('dlg').innerHTML=`<b style="font-size:18px">Inserisci ospite</b>
 <div class="sm" style="margin:6px 0 10px">L'ospite guida in questo giorno. Il giro prosegue regolarmente dal turno successivo.</div>
 <input id="gn" placeholder="Nome ospite">
 <textarea id="gt" rows="3" placeholder="Nota opzionale">${esc(S.notes[d])}</textarea>
 <button class="b" onclick="addGuest('${d}')">Inserisci ospite</button>
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;
 $('dlg').showModal();
}

function addGuest(d){
 const n=$('gn').value.trim()||'Ospite';
 noteSet(d,$('gt').value);
 S.overrides[d]={n,g:1,type:'guest'};
 save();$('dlg').close();render();
}

function removeGuest(d){
 delete S.overrides[d];save();$('dlg').close();render();
}

function absenceUI(i){
 const {ds,q}=display(),d=ds[i],w=mon(d),wd=weekDates(w);
 const currentDriver=S.names.includes(q[i].n)?q[i].n:S.names[0];
 const opts=S.names.map(n=>`<option value="${esc(n)}"${n===currentDriver?' selected':''}>${esc(n)}</option>`).join('');

 $('dlg').innerHTML=`<b style="font-size:18px">Guidatore assente</b>
 <div class="sm" style="margin:6px 0 10px">Seleziona chi non guiderà nella settimana ${range(wd[0],wd[6])}. I suoi turni verranno saltati e gli altri guidatori si compatteranno.</div>
 <select id="as_who">${opts}</select>
 <textarea id="an" rows="3" placeholder="Motivo">Assente</textarea>
 <button class="b" onclick="addAbsence('${w}')">Conferma assenza</button>
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;
 $('dlg').showModal();
}

function addAbsence(whoWeek){
 const name=$('as_who').value;
 const note=$('an').value.trim()||`${name} assente`,id=whoWeek+'|'+name;
 if(S.absences.some(a=>a.id===id))return alert('Questa assenza è già presente per questa settimana.');
 S.absences.push({id,week:whoWeek,name,note});
 save();$('dlg').close();render();
}

function undoAbsence(id){
 const a=S.absences.find(x=>x.id===id);if(!a)return;
 if(!confirm(`Annullare l'assenza di ${a.name}?`))return;
 S.absences=S.absences.filter(x=>x.id!==id);
 save();$('dlg').close();render();
}

function addExtra(){
 $('dlg').innerHTML=`<b style="font-size:18px">Aggiungi giorno lavorativo</b>
 <div class="sm" style="margin:6px 0 10px">Aggiunge un sabato, una domenica o una festività nel giro normale.</div>
 <input id="xd" type="date">
 <button class="b" onclick="doExtra()">Aggiungi giorno</button>
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;
 $('dlg').showModal();
}

function doExtra(){
 const d=$('xd').value;
 if(!d)return alert('Scegli una data');
 if(S.extra.includes(d))return alert('Questo giorno è già presente tra i giorni extra');
 if(d<todayS())return alert('Puoi aggiungere solo giorni da oggi in avanti');
 if(!isHoliday(dt(d)))return alert('Questo giorno è già un normale giorno lavorativo');
 S.extra.push(d);S.extra.sort();save();$('dlg').close();render();
}

function removeExtra(d){
 if(!confirm('Rimuovere questo giorno extra?'))return;
 S.extra=S.extra.filter(x=>x!==d);delete S.overrides[d];save();$('dlg').close();render();
}

function removeDay(d){
 if(!confirm('Rimuovere questo giorno? I giorni successivi verranno ricalcolati come se non fosse mai esistito.'))return;
 if(!S.removed.includes(d))S.removed.push(d);
 delete S.overrides[d];delete S.notes[d];save();$('dlg').close();render();
}

function show(t){tab=t;render();if(t!=='c')scrollTo(0,0)}
function tw(k){openW.has(k)?openW.delete(k):openW.add(k);const e=$('w_'+k);if(e)e.classList.toggle('open')}
function tp(){showPast=!showPast;$('pg').classList.toggle('open')}

function setCol(i,v){
 S.colors[S.names[i]]=v;
 const a=$('sa'+i),s=$('ss'+i);
 if(a)a.style.background=v;if(s)s.style.background=v;
 save();
}

function reset(){
 if(confirm('Cancellare tutto? Prima fai un backup JSON.')){
  localStorage.removeItem(KEY);S=null;render();
 }
}

function navHtml(){
 return [['c','Calendario'],['s','Statistiche'],['i','Impostazioni']]
 .map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="show('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}</button>`).join('');
}

function donut(o,keys){
 const tot=keys.reduce((s,k)=>s+(o[k]||0),0);if(!tot)return '';
 let acc=0,seg=[];
 keys.forEach(k=>{const v=o[k]||0;if(!v)return;const a=acc/tot*360;acc+=v;seg.push(`${col(k,!S.names.includes(k))} ${a}deg ${acc/tot*360}deg`)});
 return `<div class="donut" style="background:conic-gradient(${seg.join(',')})"><div><b>${tot}</b><small>giorni</small></div></div>`;
}

function rank(o,keys,next){
 const tot=keys.reduce((s,k)=>s+(o[k]||0),0)||1,mx=Math.max(1,...keys.map(k=>o[k]||0));
 return [...keys].sort((a,b)=>(o[b]||0)-(o[a]||0)).map(k=>{
  const g=!S.names.includes(k),v=o[k]||0;
  return `<div class="srow"><div class="l">${av(k,g,34)}<b>${esc(k)}</b><span>${v}</span><em>${Math.round(v/tot*100)}%</em></div><div class="bar"><i style="width:${v/mx*100}%;background:${col(k,g)}"></i></div>${next&&next[k]?`<div class="nx">Prossimo turno: ${next[k]}</div>`:''}</div>`;
 }).join('');
}

function render(){
 const app=$('app');$('nav').style.display=S?'flex':'none';

 if(!S){
  app.innerHTML=`<div class="hero"><div class="wrap"><div class="logo">${appLogo()}<div><h1>Turni Auto</h1><div style="opacity:.9">Crea il calendario di chi guida</div></div></div></div></div>
  <div class="wrap">
   <div class="card"><div class="step"><i>1</i><b>Quanti guidatori?</b></div><div class="seg">${[2,3,4,5].map(n=>`<button data-n="${n}" class="${n===setupN?'on':''}" onclick="setN(${n})">${n}</button>`).join('')}</div></div>
   <div class="card"><div class="step"><i>2</i><b>Nomi e colori</b></div><div class="sm" style="margin-bottom:6px">Scrivi i nomi nell'ordine di guida.</div><div id="nm"></div><div class="sm" style="margin-top:14px">Ordine di rotazione</div><div class="ord" id="ord"></div></div>
   <div class="card"><div class="step"><i>3</i><b>Da quando parte?</b></div><input id="sd" type="date" value="${todayS()}"><div class="sm">Se scegli un festivo o un weekend, si parte dal primo giorno lavorativo utile.</div></div>
   <button class="b" onclick="create()" style="font-size:17px;padding:16px">Genera calendario</button>
   <button class="b s" onclick="$('imf').click()">Ho già un backup: importalo</button>
  </div>`;
  drawNames();return;
 }

 ensure();prune();
 const {ds,q}=display();
 $('nav').innerHTML=navHtml();

 if(tab==='c'){
  const today=todayS(),cw=mon(today),weeks=new Map();
  ds.forEach((d,i)=>{const k=mon(d);if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(i)});

  const keys=[...weeks.keys()],past=keys.filter(k=>k<cw),next=keys.filter(k=>k>=cw);
  if(!initOpen){openW.add(weeks.has(cw)?cw:next[0]);initOpen=1}

  const ni=ds.findIndex(d=>d>=today),now=ni>=0?q[ni]:null;

  const wkHtml=k=>{
   const idx=weeks.get(k),first=ds[idx[0]],last=ds[idx[idx.length-1]];
   const nc=idx.filter(i=>S.notes[ds[i]]).length,abs=S.absences.filter(a=>a.week===k);

   let h=`<section class="wk ${openW.has(k)?'open':''} ${k===cw?'cur':''}" id="w_${k}">
   <button class="wh" onclick="tw('${k}')"><div class="wt"><b>Settimana ${wnum(k)}${k===cw?' <span class="bd t">ORA</span>':''}</b><small>${range(first,last)}${nc?' · '+nc+(nc===1?' nota':' note'):''}${abs.length?' · '+abs.map(a=>esc(a.name)+' assente').join(', '):''}</small></div><div class="mini">${idx.map(i=>av(q[i].n,q[i].g,24)).join('')}</div>${CHEV}</button><div class="wb"><div class="wi">`;

   idx.forEach(i=>{
    const d=ds[i],x=q[i],dd=dt(d),extra=S.extra.includes(d);
    h+=`<div class="dr ${d===today?'t':''} ${d<today?'pa':''}" onclick="edit(${i})"><div class="dd"><small>${dd.toLocaleDateString('it-IT',{weekday:'short'})}</small><b>${dd.getDate()}</b></div>${av(x.n,x.g,40)}<div class="dn"><b>${esc(x.n)}</b>${x.g?'<span class="bd o">ospite</span>':''}${extra?'<span class="bd e">extra</span>':''}${x.type==='swap'?'<span class="bd t">scambio</span>':''}${S.notes[d]?`<div class="nt">${esc(S.notes[d])}</div>`:''}</div></div>`;
   });

   return h+'</div></div></section>';
  };

  let h=`<div class="hero"><div class="wrap"><div class="hrow"><h1>Turni Auto</h1><button class="pill" onclick="addExtra()">+ Giorno extra</button></div>${now?`<div class="today">${av(now.n,now.g,46)}<div><small>${ds[ni]===today?'Oggi guida':'Prossimo turno · '+dt(ds[ni]).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</small><b>${esc(now.n)}</b></div></div>`:''}</div></div><div class="wrap">`;

  if(past.length){
   const n=past.reduce((s,k)=>s+weeks.get(k).length,0);
   h+=`<section class="wk pg ${showPast?'open':''}" id="pg"><button class="wh" onclick="tp()"><div class="wt"><b>Giorni passati</b><small>${n} giorni · ${past.length} settimane (fino a 60 date)</small></div>${CHEV}</button><div class="wb"><div class="wi"><div class="pgi">${[...past].reverse().map(wkHtml).join('')}</div></div></div></section>`;
  }

  let mm='';
  next.forEach(k=>{
   const m=dt(ds[weeks.get(k)[0]]).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
   if(m!==mm){mm=m;h+=`<div class="mh">${m}</div>`}
   h+=wkHtml(k);
  });

  app.innerHTML=h+'</div>';
  const cur=$('w_'+cw);
  if(cur&&!window._sc){window._sc=1;setTimeout(()=>cur.scrollIntoView({block:'start'}),50)}
 }

 else if(tab==='s'){
  const t=todayS(),hist={},fut={},nx={};
  ds.forEach((d,i)=>{
   const k=q[i].g?'Ospiti':q[i].n;
   if(d<t)hist[k]=(hist[k]||0)+1;
   else{fut[k]=(fut[k]||0)+1;if(!nx[k])nx[k]=dt(d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
  });

  const hasHistGuests=!!(hist.Ospiti&&hist.Ospiti>0);
  const hasFutGuests=!!(fut.Ospiti&&fut.Ospiti>0);
  const histKeys=[...new Set([...S.names,...(hasHistGuests?['Ospiti']:[]),...Object.keys(hist)])];
  const futKeys=[...new Set([...S.names,...(hasFutGuests?['Ospiti']:[]),...Object.keys(fut)])];
  const past=Object.values(hist).reduce((s,v)=>s+v,0),future=Object.values(fut).reduce((s,v)=>s+v,0);

  app.innerHTML=`<div class="wrap"><div class="ttl">Statistiche</div><div class="tiles"><div class="tile"><b>${past}</b><small>Giorni trascorsi</small></div><div class="tile"><b>${hist.Ospiti||0}</b><small>Ospiti nello storico</small></div><div class="tile"><b>${fut.Ospiti||0}</b><small>Ospiti in programma</small></div><div class="tile"><b>${S.extra.filter(d=>d>=t).length}</b><small>Giorni extra in arrivo</small></div></div><div class="card"><h3>Storico recente (${past} giorni)</h3>${past?`<div class="sbox">${donut(hist,histKeys)}<div class="rk">${rank(hist,histKeys)}</div></div>`:'<div class="empty">Non ci sono ancora giorni trascorsi.</div>'}</div><div class="card"><h3>Prossimi 6 mesi (${future} giorni)</h3><div class="sbox">${donut(fut,futKeys)}<div class="rk">${rank(fut,futKeys,nx)}</div></div></div></div>`;
 }

 else{
  app.innerHTML=`<div class="wrap"><div class="ttl">Impostazioni</div><div class="sm" style="margin:-8px 4px 16px">Turni Auto · Versione ${APP_VERSION}</div>
  <div class="card"><h3>Colori dei guidatori</h3>${S.names.map((n,i)=>`<div class="nm"><span class="av" id="sa${i}" style="--s:40px;background:${S.colors[n]}">${esc(ini(n))}</span><b>${esc(n)}</b><label class="sw" id="ss${i}" style="background:${S.colors[n]}"><input type="color" value="${S.colors[n]}" oninput="setCol(${i},this.value)"></label></div>`).join('')}</div>
  <div class="card"><h3>Assenze programmate</h3>${S.absences.length?S.absences.map(a=>`<div class="nm"><span class="av" style="--s:36px;background:${S.colors[a.name]||GC}">${esc(ini(a.name))}</span><div style="flex:1"><b>${esc(a.name)}</b><div class="sm">${range(a.week,weekDates(a.week)[6])}<br>${esc(a.note)}</div></div><button class="b x" style="width:auto;margin:0;padding:9px 12px" data-id="${esc(a.id)}" onclick="undoAbsence(this.dataset.id)">Annulla</button></div>`).join(''):'<div class="sm">Nessuna assenza programmata.</div>'}</div>
  <div class="card"><h3>Backup</h3><div class="sm">Ultimo backup: ${S.lb?dt(S.lb).toLocaleDateString('it-IT'):'mai'}</div><button class="b" onclick="exp()">Esporta backup</button><button class="b s" onclick="$('imf').click()">Importa backup</button></div>
  <div class="card"><h3>Zona pericolosa</h3><button class="b x" onclick="reset()">Cancella tutto e ricomincia</button></div></div>`;
 }
}

if(S){ensure();prune()}
render();

$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
