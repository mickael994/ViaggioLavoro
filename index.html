<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turni Auto">
<meta name="theme-color" content="#6d4aff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Turni Auto</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#1e1b3a;--mut:#7a7699;--ac:#6d4aff;--ac2:#ff4d8d;--line:#ece8fa;--sh:0 6px 20px rgba(80,60,160,.12);--tod:#fff7d6}
@media(prefers-color-scheme:dark){:root{--bg:#12101f;--card:#1d1a30;--tx:#f1eeff;--mut:#9a95bd;--line:#2a2644;--sh:0 6px 20px rgba(0,0,0,.35);--tod:#3a3320}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.35 -apple-system,"SF Pro Rounded",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
.wrap{max-width:760px;margin:0 auto;padding:0 clamp(10px,3vw,20px)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 0 26px;border-radius:0 0 28px 28px;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.5px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;backdrop-filter:blur(8px)}
.today{margin-top:14px;background:rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.today small{display:block;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.6px}.today b{font-size:20px}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,40px);height:var(--s,40px);border-radius:50%;color:#fff;font-weight:800;font-size:calc(var(--s,40px)*.45);box-shadow:0 2px 6px rgba(0,0,0,.18);transition:background .2s}
.av.g{border:2px dashed rgba(255,255,255,.85)}
.mh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:18px 6px 8px}
.wk{background:var(--card);border-radius:20px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;border:2px solid transparent}
.wk.cur{border-color:var(--ac)}
.wh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:14px 16px;text-align:left;cursor:pointer}
.wt{flex:1;min-width:0}.wt b{display:block}.wt small{color:var(--mut)}
.mini{display:flex}.mini .av{--s:24px;margin-left:-6px;border:2px solid var(--card);box-shadow:none}.mini .av:first-child{margin-left:0}
.wk.open>.wh .mini{display:none}
.chev{width:22px;height:22px;flex:none;color:var(--ac);transition:transform .3s}.wk.open>.wh .chev{transform:rotate(180deg)}
.wb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.wk.open>.wb{grid-template-rows:1fr}.wi{overflow:hidden}
.pg{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.pgi{padding:0 8px 8px}.pgi .wk{box-shadow:none;border:1px solid var(--line)}
.dr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.dr:active{background:var(--line)}.dr.t{background:var(--tod)}
.dr.pa .dd,.dr.pa .dn>b,.dr.pa .av{opacity:.65}
.dd{width:42px;text-align:center;flex:none}.dd small{display:block;color:var(--mut);text-transform:uppercase;font-size:11px;font-weight:700}.dd b{font-size:20px}
.dn{flex:1;min-width:0}.dn b{font-size:17px}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;color:#fff}
.bd.o{background:#64748b}.bd.e{background:#ef4444}.bd.t{background:var(--ac)}
.nt{color:var(--mut);font-size:13px;margin-top:3px;overflow-wrap:anywhere;border-left:3px solid var(--ac);padding-left:8px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.ttl{font-size:clamp(24px,5vw,30px);font-weight:800;margin:calc(env(safe-area-inset-top) + 18px) 4px 14px;letter-spacing:-.4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);width:100%;padding:13px 14px;margin:6px 0;border:2px solid var(--line);border-radius:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.b{display:block;width:100%;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}
.b.s{background:var(--line);color:var(--tx)}.b.x{background:#ef4444}.b:active{transform:scale(.98)}
.sm{font-size:13px;color:var(--mut)}
.nm{display:flex;align-items:center;gap:10px;margin:8px 0}.nm input[type=text],.nm input:not([type]){flex:1;margin:0}.nm b{flex:1}
.sw{width:44px;height:44px;border-radius:14px;overflow:hidden;position:relative;flex:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--line)}
.sw input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;margin:0;padding:0;border:0}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.step b{font-size:17px}
.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:800;font-size:20px;padding:12px 0;border-radius:12px;transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 12px rgba(109,74,255,.4)}
.ord{display:flex;align-items:center;flex-wrap:wrap;gap:6px 4px;margin-top:6px}
.ord .it{display:flex;align-items:center;gap:6px}.ord .it small{font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .ar{color:var(--mut);font-size:18px;margin:0 2px}
.logo{display:flex;align-items:center;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile small{color:var(--mut);font-size:12px;font-weight:600}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.sbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.donut>div{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut b{font-size:26px;font-weight:800;line-height:1}.donut small{color:var(--mut);font-size:12px}
.rk{flex:1;min-width:230px}
.srow{margin:12px 0}.srow .l{display:flex;align-items:center;gap:10px}.srow .l b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .l span{font-weight:800;font-size:18px}.srow .l em{font-style:normal;color:var(--mut);font-size:13px;width:42px;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.nx{font-size:12px;color:var(--mut);margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(92%,460px);display:flex;background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(60,40,140,.28);padding:6px;border:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:18px;padding:8px 4px;font:inherit;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px}nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
dialog{border:0;border-radius:26px 26px 0 0;padding:20px;width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--tx);max-height:92dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
dialog::backdrop{background:rgba(10,5,30,.5);backdrop-filter:blur(3px)}
@media(min-width:600px){dialog{margin:auto;border-radius:26px}.dr{padding:14px 20px}.wh{padding:16px 20px}}
@media(max-height:480px) and (orientation:landscape){.hero{padding-bottom:14px}.today{margin-top:8px;padding:8px 12px}}
@media(max-width:360px){.dd{width:36px}.dn b{font-size:15px}.bd{margin-left:4px}.donut{width:130px;height:130px}.donut>div{width:82px;height:82px}}
</style></head><body><div id="app"></div>
<input type="file" id="imf" accept=".json,application/json" style="display:none" onchange="imp(this)">
<nav id="nav" style="display:none"></nav>
<dialog id="dlg"></dialog>
<script>
const KEY='turniAuto2',N=250,KEEP=60,PAL=['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6'],GC='#64748b',$=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem(KEY)||'null'),tab='c',openW=new Set(),initOpen=0,showPast=false,setupN=4,SV={n:[],c:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>new Date(s+'T12:00:00');
const todayS=()=>iso(new Date());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>((n||'').trim().charAt(0).toUpperCase())||'?';
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const IC={c:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',s:'<path d="M5 20V10M12 20V4M19 20v-7"/>',i:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const LOGO='<svg width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="rgba(255,255,255,.22)"/><rect x="12" y="14" width="40" height="38" rx="7" fill="#fff"/><rect x="12" y="14" width="40" height="11" rx="5" fill="#1e1b3a"/><rect x="12" y="20" width="40" height="5" fill="#1e1b3a"/><circle cx="23" cy="35" r="4.5" fill="#ef4444"/><circle cx="41" cy="35" r="4.5" fill="#3b82f6"/><circle cx="23" cy="45" r="4.5" fill="#10b981"/><circle cx="41" cy="45" r="4.5" fill="#f59e0b"/></svg>';
function ensure(){if(!S)return;S.colors=S.colors||{};S.names.forEach((n,i)=>{if(!S.colors[n])S.colors[n]=PAL[i%PAL.length]})}
const col=(n,g)=>(!g&&S&&S.colors&&S.colors[n])||GC;
const av=(n,g,s)=>`<span class="av ${g?'g':''}" style="--s:${s||40}px;background:${col(n,g)}">${esc(ini(n))}</span>`;
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,(t%31)+1,12)}
function isOff(d){const w=d.getDay();if(w==0||w==6)return true;
 if(['1-1','6-1','25-4','1-5','2-6','15-8','1-11','8-12','25-12','26-12'].includes(d.getDate()+'-'+(d.getMonth()+1)))return true;
 const p=easter(d.getFullYear());p.setDate(p.getDate()+1);return iso(p)==iso(d)}
const isWork=d=>!isOff(d)||S.x.includes(iso(d));
function nextDay(d){do{d.setDate(d.getDate()+1)}while(!isWork(d));return d}
function dates(){const r=[S.base];let d=dt(S.base);while(r.length<S.q.length){d=nextDay(d);r.push(iso(d))}return r.slice(0,S.q.length)}
function lastReg(p){for(let j=p-1;j>=0;j--)if(!S.q[j].g&&S.names.includes(S.q[j].n))return S.names.indexOf(S.q[j].n);return S.li}
function fill(){const t=todayS(),pa=S.q.length?dates().filter(d=>d<t).length:0,T=N+pa;let i=lastReg(S.q.length);
 while(S.q.length<T){i=(i+1)%S.names.length;S.q.push({n:S.names[i],g:0})}}
function reflow(p){let i=lastReg(p);for(let j=p;j<S.q.length;j++)if(!S.q[j].g){i=(i+1)%S.names.length;S.q[j].n=S.names[i]}}
function prune(){const c=new Date();c.setDate(c.getDate()-KEEP);const cut=iso(c);let ds=dates();
 while(ds.length&&ds[0]<cut){const x=S.q.shift();ds.shift();const k=x.g?'Ospiti':x.n;S.tot[k]=(S.tot[k]||0)+1;
  if(!x.g&&S.names.includes(x.n))S.li=S.names.indexOf(x.n)}
 if(S.q.length)S.base=ds[0];else{const y=new Date();y.setDate(y.getDate()-1);y.setHours(12);S.base=iso(nextDay(y))}
 S.x=S.x.filter(d=>d>=cut);Object.keys(S.notes).forEach(d=>{if(d<cut)delete S.notes[d]});
 fill();ensure();save()}
function mon(s){const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function wnum(k){const d=dt(k);d.setDate(d.getDate()+3);const j=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7)}
function range(a,b){const x=dt(a),y=dt(b),mo=d=>d.toLocaleDateString('it-IT',{month:'short'});
 if(a==b)return x.getDate()+' '+mo(x);
 return x.getMonth()==y.getMonth()?`${x.getDate()} – ${y.getDate()} ${mo(y)}`:`${x.getDate()} ${mo(x)} – ${y.getDate()} ${mo(y)}`}
function grab(){for(let i=0;i<5;i++){const p=$('p'+i),c=$('c'+i);if(p)SV.n[i]=p.value;if(c)SV.c[i]=c.value}}
function setN(n){grab();setupN=n;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',+b.dataset.n==n));drawNames()}
function drawNames(){let h='';for(let i=0;i<setupN;i++){const c=SV.c[i]||PAL[i];
 h+=`<div class="nm"><span class="av" id="a${i}" style="--s:44px;background:${c}">${esc(ini(SV.n[i]))}</span>
 <input id="p${i}" placeholder="Nome guidatore ${i+1}" value="${esc(SV.n[i]||'')}" oninput="upd(${i})" autocapitalize="words" autocomplete="off">
 <label class="sw" id="s${i}" style="background:${c}"><input type="color" id="c${i}" value="${c}" oninput="upd(${i})"></label></div>`}
 $('nm').innerHTML=h;prev()}
function upd(i){const c=$('c'+i).value;$('a'+i).style.background=c;$('a'+i).textContent=ini($('p'+i).value);$('s'+i).style.background=c;prev()}
function prev(){let h='';for(let i=0;i<setupN;i++){const n=($('p'+i)||{}).value||'',c=($('c'+i)||{}).value||PAL[i];
 h+=`<div class="it"><span class="av" style="--s:30px;background:${c}">${esc(ini(n))}</span><small>${esc(n||('Nome '+(i+1)))}</small></div><span class="ar">›</span>`}
 $('ord').innerHTML=h+'<span class="ar">↻</span>'}
function create(){grab();const n=setupN,names=[],cols={};
 for(let i=0;i<n;i++){const v=($('p'+i).value||'').trim();names.push(v);cols[v]=$('c'+i).value}
 if(names.some(x=>!x))return alert('Compila il nome di tutti i guidatori');
 if(new Set(names.map(x=>x.toLowerCase())).size<n)return alert('I nomi devono essere diversi');
 if(!$('sd').value)return alert('Scegli la data di partenza');
 S={names,li:-1,tot:{},since:$('sd').value,x:[],notes:{},q:[{n:names[0],g:0}],base:$('sd').value,lb:null,colors:cols};
 const y=dt($('sd').value);y.setDate(y.getDate()-1);S.base=iso(nextDay(y));
 ensure();fill();prune();initOpen=0;window._sc=0;render()}
async function exp(){S.lb=todayS();save();
 const j=JSON.stringify({app:'turni-auto',v:2,data:S}),fn='turni-backup-'+todayS()+'.json';
 try{const f=new File([j],fn,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});render();return}}
 catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));
 a.download=fn;document.body.appendChild(a);a.click();a.remove();render()}
function imp(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result),d=o.data;
  if(o.app!=='turni-auto'||!d||!Array.isArray(d.names)||!Array.isArray(d.q)||!Array.isArray(d.x)||!d.base||!d.notes||!d.tot)throw 0;
  if(S&&!confirm('Sostituire i dati attuali con quelli del backup?'))return;
  S=d;S.li=S.li??-1;prune();tab='c';initOpen=0;window._sc=0;render();alert('Backup importato')}
  catch(e){alert('File di backup non valido')}inp.value=''};rd.readAsText(f)}
function edit(i){const ds=dates(),d=ds[i],x=S.q[i],ex=S.x.includes(d),past=d<todayS();
 $('dlg').innerHTML=`<div class="hrow" style="justify-content:flex-start;gap:12px">${av(x.n,x.g,48)}<div><b style="font-size:18px">${dt(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</b>${ex?'<div class="sm">Giorno extra</div>':''}${past?'<div class="sm">Giorno passato: puoi correggere chi ha guidato e le note</div>':''}</div></div>
 <input id="en" list="nl" value="${esc(x.n)}" placeholder="Chi guida"><datalist id="nl">${S.names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <textarea id="et" rows="3" placeholder="Note del giorno">${esc(S.notes[d])}</textarea>
 <button class="b" onclick="sv(${i})">Salva (solo questo giorno)</button>
 <button class="b s" onclick="swapUI(${i})">Scambia con un altro giorno</button>
 ${past?'':`<button class="b s" onclick="gi(${i})">Inserisci ospite qui (gli altri slittano)</button>
 ${ex?`<button class="b x" onclick="rx(${i})">Rimuovi giorno extra</button>`:''}
 ${x.g&&!ex?`<button class="b x" onclick="dg(${i})">Rimuovi ospite (ricompatta)</button>`:''}`}
 <button class="b s" onclick="$('dlg').close()">Annulla</button>`;$('dlg').showModal()}
function setNote(d){const v=$('et').value.trim();if(v)S.notes[d]=v;else delete S.notes[d]}
function sv(i){const n=$('en').value.trim();if(!n)return;setNote(dates()[i]);S.q[i]={n,g:S.names.includes(n)?0:1};save();$('dlg').close();render()}
function gi(i){const n=$('en').value.trim();setNote(dates()[i]);
 S.q.splice(i,0,{n:(!n||S.names.includes(n))?'Ospite':n,g:1});S.q.pop();save();$('dlg').close();render()}
function dg(i){S.q.splice(i,1);fill();save();$('dlg').close();render()}
function rx(i){const ds=dates(),d=ds[i];S.x=S.x.filter(z=>z!=d);const x=S.q.splice(i,1)[0];
 if(i==0&&ds[1])S.base=ds[1];if(!x.g)reflow(i);fill();save();$('dlg').close();render()}
function addX(){$('dlg').innerHTML=`<b style="font-size:18px">Giorno festivo/weekend lavorato</b>
 <input id="xd" type="date"><input id="xn" list="nl2" placeholder="Chi guida"><datalist id="nl2">${S.names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <button class="b" onclick="doX()">Aggiungi</button><button class="b s" onclick="$('dlg').close()">Annulla</button>`;$('dlg').showModal()}
function doX(){const d=$('xd').value,n=$('xn').value.trim();if(!d||!n)return;const ds=dates();
 if(!isOff(dt(d)))return alert('Quel giorno è già lavorativo');
 if(d<todayS()||d>ds[ds.length-1])return alert('Data fuori dal calendario');
 if(S.x.includes(d))return alert('Già presente');
 const p=ds.filter(z=>z<d).length,g=!S.names.includes(n);
 S.x.push(d);S.q.splice(p,0,{n,g:g?1:0});S.q.pop();if(p==0)S.base=d;if(!g)reflow(p+1);
 save();$('dlg').close();render()}
function show(t){tab=t;render();scrollTo(0,0)}
function tw(k){openW.has(k)?openW.delete(k):openW.add(k);$('w_'+k).classList.toggle('open')}
function tp(){showPast=!showPast;$('pg').classList.toggle('open')}
function swapUI(i){const ds=dates(),d=ds[i],lo=Math.max(0,i-15),hi=Math.min(S.q.length-1,i+40);let o='';
 for(let j=lo;j<=hi;j++){if(j==i)continue;
  o+=`<option value="${j}"${j==i+1?' selected':''}>${dt(ds[j]).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} · ${esc(S.q[j].n)}</option>`}
 $('dlg').innerHTML=`<b style="font-size:18px">Scambia turno</b>
 <div class="sm" style="margin:6px 0 10px">${dt(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} guida ${esc(S.q[i].n)}. Scegli l'altro giorno: i due guidatori si invertono e il resto del calendario non cambia.</div>
 <select id="swd">${o}</select>
 <button class="b" onclick="doSwap(${i})">Scambia</button><button class="b s" onclick="$('dlg').close()">Annulla</button>`}
function doSwap(i){const j=+$('swd').value;if(isNaN(j)||j==i)return;
 const a=S.q[i],b=S.q[j];S.q[i]={n:b.n,g:b.g,s:1};S.q[j]={n:a.n,g:a.g,s:1};save();$('dlg').close();render()}
function setCol(i,v){S.colors[S.names[i]]=v;const e=$('sa'+i);if(e)e.style.background=v;$('ss'+i).style.background=v;save()}
function reset(){if(confirm('Cancellare TUTTO (calendario e statistiche)? Fai prima un backup.')){localStorage.removeItem(KEY);S=null;render()}}
function navHtml(){return [['c','Calendario'],['s','Statistiche'],['i','Impostazioni']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="show('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}</button>`).join('')}
function donut(o,keys){const tot=keys.reduce((s,k)=>s+(o[k]||0),0);if(!tot)return '';let acc=0,seg=[];
 keys.forEach(k=>{const v=o[k]||0;if(!v)return;const a=acc/tot*360;acc+=v;seg.push(`${col(k,!S.names.includes(k))} ${a}deg ${acc/tot*360}deg`)});
 return `<div class="donut" style="background:conic-gradient(${seg.join(',')})"><div><b>${tot}</b><small>giorni</small></div></div>`}
function rank(o,keys,nx){const tot=keys.reduce((s,k)=>s+(o[k]||0),0)||1,mx=Math.max(1,...keys.map(k=>o[k]||0));
 return [...keys].sort((a,b)=>(o[b]||0)-(o[a]||0)).map(k=>{const g=!S.names.includes(k),v=o[k]||0;
  return `<div class="srow"><div class="l">${av(k,g,34)}<b>${esc(k)}</b><span>${v}</span><em>${Math.round(v/tot*100)}%</em></div><div class="bar"><i style="width:${v/mx*100}%;background:${col(k,g)}"></i></div>${nx&&nx[k]?`<div class="nx">Prossimo turno: ${nx[k]}</div>`:''}</div>`}).join('')}
function render(){const a=$('app');$('nav').style.display=S?'flex':'none';
 if(!S){a.innerHTML=`<div class="hero"><div class="wrap"><div class="logo">${LOGO}<div><h1>Turni Auto</h1><div style="opacity:.9">Crea il calendario di chi guida</div></div></div></div></div>
  <div class="wrap">
  <div class="card"><div class="step"><i>1</i><b>Quanti guidatori?</b></div>
   <div class="seg">${[2,3,4,5].map(n=>`<button data-n="${n}" class="${n==setupN?'on':''}" onclick="setN(${n})">${n}</button>`).join('')}</div></div>
  <div class="card"><div class="step"><i>2</i><b>Nomi e colori</b></div>
   <div class="sm" style="margin-bottom:6px">Scrivi i nomi nell'ordine di guida. Tocca il quadrato colorato per cambiare colore.</div>
   <div id="nm"></div><div class="sm" style="margin-top:14px">Ordine di rotazione</div><div class="ord" id="ord"></div></div>
  <div class="card"><div class="step"><i>3</i><b>Da quando parte?</b></div>
   <input id="sd" type="date" value="${todayS()}"><div class="sm">Se la data cade in un giorno non lavorativo, si parte dal primo giorno utile.</div></div>
  <button class="b" onclick="create()" style="font-size:17px;padding:16px">Genera calendario</button>
  <button class="b s" onclick="$('imf').click()">Ho già un backup: importalo</button></div>`;drawNames();return}
 $('nav').innerHTML=navHtml();
 if(tab=='c'){const t=todayS(),ds=dates(),ck=mon(t),W=new Map();
  ds.forEach((d,i)=>{const k=mon(d);if(!W.has(k))W.set(k,[]);W.get(k).push(i)});
  const keys=[...W.keys()],pk=keys.filter(k=>k<ck),mk=keys.filter(k=>k>=ck);
  if(!initOpen){openW.add(W.has(ck)?ck:mk[0]);initOpen=1}
  const ni=ds.findIndex(d=>d>=t),nx=ni>=0?S.q[ni]:null;
  const wkHtml=k=>{const idx=W.get(k),first=ds[idx[0]],last=ds[idx[idx.length-1]],nn=idx.filter(i=>S.notes[ds[i]]).length;
   let h=`<section class="wk ${openW.has(k)?'open':''} ${k==ck?'cur':''}" id="w_${k}"><button class="wh" onclick="tw('${k}')">
    <div class="wt"><b>Settimana ${wnum(k)}${k==ck?' <span class="bd t">ORA</span>':''}</b><small>${range(first,last)}${nn?' · '+nn+(nn==1?' nota':' note'):''}</small></div>
    <div class="mini">${idx.map(i=>av(S.q[i].n,S.q[i].g,24)).join('')}</div>${CHEV}</button>
    <div class="wb"><div class="wi">`;
   idx.forEach(i=>{const d=ds[i],x=S.q[i],ex=S.x.includes(d),dd=dt(d);
    h+=`<div class="dr ${d==t?'t':''} ${d<t?'pa':''}" onclick="edit(${i})"><div class="dd"><small>${dd.toLocaleDateString('it-IT',{weekday:'short'})}</small><b>${dd.getDate()}</b></div>${av(x.n,x.g,40)}
     <div class="dn"><b>${esc(x.n)}</b>${x.g?'<span class="bd o">ospite</span>':''}${ex?'<span class="bd e">extra</span>':''}${x.s?'<span class="bd t">scambio</span>':''}${S.notes[d]?`<div class="nt">${esc(S.notes[d])}</div>`:''}</div></div>`});
   return h+`</div></div></section>`};
  let h=`<div class="hero"><div class="wrap"><div class="hrow"><h1>Turni Auto</h1><button class="pill" onclick="addX()">+ Giorno extra</button></div>
  ${nx?`<div class="today">${av(nx.n,nx.g,46)}<div><small>${ds[ni]==t?'Oggi guida':'Prossimo turno · '+dt(ds[ni]).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</small><b>${esc(nx.n)}</b></div></div>`:''}</div></div><div class="wrap">`;
  if(pk.length){const n=pk.reduce((s,k)=>s+W.get(k).length,0),nn=pk.reduce((s,k)=>s+W.get(k).filter(i=>S.notes[ds[i]]).length,0);
   h+=`<section class="wk pg ${showPast?'open':''}" id="pg"><button class="wh" onclick="tp()"><div class="wt"><b>Giorni passati</b><small>${n} giorni · ${pk.length} settimane${nn?' · '+nn+(nn==1?' nota':' note'):''}</small></div>${CHEV}</button>
   <div class="wb"><div class="wi"><div class="pgi">${[...pk].reverse().map(wkHtml).join('')}</div></div></div></section>`}
  let lm='';
  mk.forEach(k=>{const mm=dt(ds[W.get(k)[0]]).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
   if(mm!=lm){lm=mm;h+=`<div class="mh">${mm}</div>`}h+=wkHtml(k)});
  a.innerHTML=h+'</div>';const c=$('w_'+ck);if(c&&!window._sc){window._sc=1;setTimeout(()=>c.scrollIntoView({block:'start'}),50)}}
 else if(tab=='s'){const ds=dates(),t=todayS(),fut={},nx={},hist={...S.tot};let nf=0;
  S.q.forEach((x,i)=>{const k=x.g?'Ospiti':x.n;
   if(ds[i]<t){hist[k]=(hist[k]||0)+1;return}
   nf++;fut[k]=(fut[k]||0)+1;if(!nx[k])nx[k]=dt(ds[i]).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})});
  const keys=[...new Set([...S.names,'Ospiti',...Object.keys(hist)])],kf=[...new Set([...S.names,'Ospiti'])];
  const past=Object.values(hist).reduce((s,v)=>s+v,0);
  a.innerHTML=`<div class="wrap"><div class="ttl">Statistiche</div>
  <div class="tiles"><div class="tile"><b>${past}</b><small>Giorni trascorsi</small></div><div class="tile"><b>${hist['Ospiti']||0}</b><small>Ospiti nello storico</small></div>
  <div class="tile"><b>${fut['Ospiti']||0}</b><small>Ospiti in programma</small></div><div class="tile"><b>${S.x.filter(d=>d>=t).length}</b><small>Giorni extra in arrivo</small></div></div>
  <div class="card"><h3>Storico dal ${dt(S.since).toLocaleDateString('it-IT')}</h3>
  ${past?`<div class="sbox">${donut(hist,keys)}<div class="rk">${rank(hist,keys)}</div></div>`:'<div class="empty">Ancora nessun dato storico. I giorni passati vengono conteggiati qui man mano che trascorrono.</div>'}</div>
  <div class="card"><h3>Prossimi ${nf} giorni</h3><div class="sbox">${donut(fut,kf)}<div class="rk">${rank(fut,kf,nx)}</div></div></div></div>`}
 else a.innerHTML=`<div class="wrap"><div class="ttl">Impostazioni</div>
  <div class="card"><h3>Colori dei guidatori</h3>${S.names.map((n,i)=>`<div class="nm"><span class="av" id="sa${i}" style="--s:40px;background:${S.colors[n]}">${esc(ini(n))}</span><b>${esc(n)}</b><label class="sw" id="ss${i}" style="background:${S.colors[n]}"><input type="color" value="${S.colors[n]}" oninput="setCol(${i},this.value)"></label></div>`).join('')}
  <div class="sm">Il nuovo colore compare ovunque dal prossimo cambio di scheda.</div></div>
  <div class="card"><h3>Backup</h3><div class="sm">Ultimo backup: ${S.lb?dt(S.lb).toLocaleDateString('it-IT'):'mai'}</div>
  <button class="b" onclick="exp()">Esporta backup</button><button class="b s" onclick="$('imf').click()">Importa backup</button></div>
  <div class="card"><h3>Zona pericolosa</h3><button class="b x" onclick="reset()">Cancella tutto e ricomincia</button></div></div>`}
if(S){ensure();prune()}render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
